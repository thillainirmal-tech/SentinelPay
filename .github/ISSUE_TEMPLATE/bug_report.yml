name: Bug report
description: Report a reproducible problem in SentinelPay
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, tokens, personal data, or unredacted production logs.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or release
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant Java, Docker, browser, and operating-system versions.
    validations:
      required: true
